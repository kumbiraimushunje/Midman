services:
  - type: web
    name: midman-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: CRON_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: notifications@midman.app
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: PAYMENT_RETURN_URL
        sync: false
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
      - key: PAYNOW_RESULT_URL
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET_HASH
        sync: false

  # Manual stand-in from send_due_reminders() promoted to a real periodic
  # trigger now that the backend has a stable home to call. Hits the web
  # service above over Render's private network (BACKEND_HOSTPORT) rather
  # than the public internet, authenticating with CRON_SECRET since it has
  # no staff login of its own - see app/main.py's run_due_inspection_reminders
  # and scripts/trigger_reminders.py.
  - type: cron
    name: midman-reminder-cron
    runtime: python
    plan: starter
    schedule: "0 6 * * *"
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/trigger_reminders.py"
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          name: midman-backend
          type: web
          property: hostport
      - key: CRON_SECRET
        sync: false
